<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Smart Livestock / Cow Silhouette + Vision Scale Nodes -->
  <g transform="translate(10, 12)" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cattle Head & Horns outline -->
    <path d="M 6 10 C 6 4, 12 3, 16 7 C 20 5, 24 5, 28 7 C 32 3, 38 4, 38 10 C 38 18, 34 26, 28 30 L 16 30 C 10 26, 6 18, 6 10 Z" fill="#16a34a" fill-opacity="0.15" />
    <!-- Ears -->
    <path d="M 6 12 C 1 12, 0 16, 4 18 C 7 18, 8 15, 8 14" />
    <path d="M 38 12 C 43 12, 44 16, 40 18 C 37 18, 36 15, 36 14" />
    <!-- Muzzle / Scale target -->
    <ellipse cx="22" cy="27" rx="7" ry="4" stroke-width="2" fill="#16a34a" fill-opacity="0.25" />
    <circle cx="19" cy="27" r="1" fill="#22c55e" stroke="none" />
    <circle cx="25" cy="27" r="1" fill="#22c55e" stroke="none" />
    <!-- Eyes -->
    <circle cx="15" cy="17" r="1.5" fill="#4ade80" stroke="none" />
    <circle cx="29" cy="17" r="1.5" fill="#4ade80" stroke="none" />
    <!-- AI Precision / Scan Brackets -->
    <path d="M 1 6 L 1 1 L 6 1" stroke="#22c55e" stroke-width="2" />
    <path d="M 38 1 L 43 1 L 43 6" stroke="#22c55e" stroke-width="2" />
    <path d="M 1 33 L 1 38 L 6 38" stroke="#22c55e" stroke-width="2" />
    <path d="M 38 38 L 43 38 L 43 33" stroke="#22c55e" stroke-width="2" />
  </g>
</svg>
